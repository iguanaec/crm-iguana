# Sirve el build de Vite y reenvia /api hacia el servicio backend por la
# red privada de Railway. El frontend ya llama a rutas relativas
# ("/api/v1/...", ver src/lib/api.ts), asi que no hace falta tocar ese
# codigo: solo se necesita este proxy en produccion.
#
# Si el servicio backend en Railway no se llama "backend", o su variable
# PORT no es 5000, ajusta el host:puerto de abajo (ver DEPLOY.md).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend.railway.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
