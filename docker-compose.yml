services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-iguana-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_local_dev
      POSTGRES_DB: crm_iguana
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_iguana"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
